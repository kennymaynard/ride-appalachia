services:
  - type: web
    name: appalachia-offroad-backend
    env: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: appalachia-offroad-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://appalachiaoffroadapp.com
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_LOCAL_BUSINESS
        sync: false
      - key: STRIPE_PRICE_LODGING_PARTNER
        sync: false
      - key: STRIPE_PRICE_VETERAN_OWNED
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Appalachia Offroad <support@appalachiaoffroadapp.com>
      - key: LEAD_NOTIFY_EMAIL
        value: support@appalachiaoffroadapp.com
      - key: ADMIN_PASSWORD
        generateValue: true

  - type: web
    name: appalachia-offroad-frontend
    env: node
    rootDir: frontend
    plan: free
    buildCommand: npm ci && SKIP_API_DURING_BUILD=1 npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: API_URL
        value: https://api.appalachiaoffroadapp.com
      - key: NEXT_PUBLIC_API_URL
        value: https://api.appalachiaoffroadapp.com

databases:
  - name: appalachia-offroad-db
    plan: free
